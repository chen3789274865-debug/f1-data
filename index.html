<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 数据可视化看板</title>
<style>
    :root {
        --bg: #F4F5F7;
        --card: #FFFFFF;
        --text: #12141A;
        --muted: #6B7280;
        --line: #E7E9EE;
        --accent: #E10600;
        --accent-soft: rgba(225, 6, 0, 0.10);
        --green: #00A19C;
        --blue: #3671C6;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #14161B;
            --card: #1D2027;
            --text: #F2F3F5;
            --muted: #9AA0AA;
            --line: #2C3038;
            --accent-soft: rgba(225, 6, 0, 0.18);
        }
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
    }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 18px 48px; }

    .hero {
        background: linear-gradient(115deg, #14161B 0%, #23262E 58%, #E10600 168%);
        border-radius: 18px;
        padding: 22px 24px 24px;
        color: #fff;
        box-shadow: 0 10px 26px rgba(16, 24, 40, 0.16);
    }

    .hero-tag { font-size: 12px; letter-spacing: 0.18em; font-weight: 600; color: #FF6B63; }
    .hero h1 { font-size: 30px; margin: 6px 0 6px; font-weight: 800; }
    .hero p { margin: 0; color: #C6C9D1; font-size: 14px; }
    .chip {
        display: inline-block; padding: 3px 10px; border-radius: 999px;
        font-size: 12px; font-weight: 600; margin-left: 8px; vertical-align: middle;
    }
    .chip-demo { background: rgba(225, 6, 0, 0.18); color: #FF8A84; }

    .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px;
        margin-top: 16px;
    }

    h2 { font-size: 17px; margin: 0 0 4px; font-weight: 700; }
    h2 .note { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }

    .controls { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    select, input[type="search"] {
        font: inherit; color: var(--text); background: var(--card);
        border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 150px;
    }
    input[type="search"] { min-width: 160px; }
    .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    button.driver {
        font: inherit; font-size: 12px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--card); color: var(--text);
        border: 1px solid var(--line); border-left-width: 4px;
        border-radius: 999px; padding: 4px 10px;
    }
    button.driver[aria-pressed="true"] {
        background: var(--accent-soft); border-color: var(--accent); font-weight: 700;
    }
    button.ghost {
        font: inherit; font-size: 12px; cursor: pointer; background: transparent;
        color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 4px 10px;
    }

    .podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .podium-card {
        background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
        border-radius: 14px; padding: 12px 14px;
    }
    .podium-pos { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; }
    .podium-code { font-size: 22px; font-weight: 800; }
    .podium-name { font-size: 13px; }
    .podium-team { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .split { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    tbody tr:hover { background: var(--accent-soft); }
    .pos { font-variant-numeric: tabular-nums; font-weight: 700; }
    .table-scroll { max-height: 430px; overflow: auto; margin-top: 8px; }

    .driver-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; margin-top: 8px; }
    .driver-cell {
        display: flex; align-items: center; gap: 6px; font-size: 12px;
        border: 1px solid var(--line); border-left: 3px solid var(--accent);
        border-radius: 10px; padding: 5px 7px;
    }
    .driver-cell .p { color: var(--muted); font-weight: 700; min-width: 14px; text-align: right; }
    .driver-cell .c { font-weight: 700; }
    .driver-cell .t { color: var(--muted); margin-left: auto; overflow: hidden; text-overflow: ellipsis; }

    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .metric { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .metric .k { font-size: 12px; color: var(--muted); }
    .metric .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .metric .d { font-size: 12px; color: var(--muted); }

    .chart { position: relative; margin-top: 8px; }
    .chart svg { display: block; width: 100%; }
    .tooltip {
        position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.12s;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 18px rgba(16, 24, 40, 0.14);
        min-width: 120px; z-index: 5;
    }
    .tooltip .row { display: flex; gap: 10px; justify-content: space-between; }
    .tooltip .row b { font-variant-numeric: tabular-nums; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }
    .empty { color: var(--muted); font-size: 13px; }
    dt, .axis { font-size: 11px; fill: var(--muted); }
    .axis-title { font-size: 12px; fill: var(--muted); }
    .grid-line { stroke: var(--line); stroke-width: 1; }
    footer { color: var(--muted); font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
    <header class="hero">
        <div class="hero-tag" id="heroTag">FORMULA 1 · 演示数据</div>
        <h1 id="heroTitle">加载中…</h1>
        <p id="heroSub"></p>
    </header>

    <section class="card">
        <div class="controls">
            <label class="field">赛季<select id="yearSelect"></select></label>
            <label class="field">大奖赛<select id="raceSelect"></select></label>
            <label class="check"><input type="checkbox" id="hideOutliers" checked> 隐藏异常圈（进站/黄旗）</label>
        </div>
        <div class="field" style="margin-top:12px;color:var(--muted);font-size:12px;">
            参与对比的车手（点击切换，建议 2～4 位）
        </div>
        <div class="chip-row" id="driverPicker"></div>
    </section>

    <section class="card">
        <h2>比赛结果 <span class="note" id="resultNote"></span></h2>
        <div class="podium" id="podium"></div>

        <div class="split">
            <div>
                <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;">
                    <strong style="font-size:14px;">最终成绩</strong>
                    <input type="search" id="resultSearch" placeholder="搜索车手或车队">
                </div>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr><th>名次</th><th>车手</th><th>姓名</th><th>车队</th><th>发车格</th><th>成绩</th><th>积分</th></tr>
                        </thead>
                        <tbody id="resultBody"></tbody>
                    </table>
                </div>
            </div>
            <div>
                <strong style="font-size:14px;">全部参赛车手</strong>
                <div class="driver-grid" id="driverGrid"></div>
            </div>
        </div>
    </section>

    <section class="metrics" id="metrics"></section>

    <section class="card">
        <h2>圈速对比 <span class="note">鼠标移到图上可查看每一圈的具体用时</span></h2>
        <div class="chart" id="lapChart"></div>
    </section>

    <section class="card">
        <h2>轮胎策略 <span class="note">每条横条代表一个 stint，颜色对应轮胎配方</span></h2>
        <div class="chart" id="tyreChart"></div>
        <div class="legend">
            <span><span class="sw" style="background:#E10600"></span>软胎</span>
            <span><span class="sw" style="background:#FFC906"></span>中性胎</span>
            <span><span class="sw" style="background:#E8E9EC"></span>硬胎</span>
        </div>
    </section>

    <section class="card">
        <h2>最快圈遥测 <span class="note">速度、油门与刹车</span></h2>
        <div class="controls" style="margin-bottom:8px;">
            <label class="field">车手<select id="telemetrySelect"></select></label>
        </div>
        <div class="chart" id="telemetryChart"></div>
    </section>

    <footer>
        这是脱机可用的演示看板：所有数据由本地算法生成，用于展示界面与图表交互，并非真实比赛成绩。
        需要真实数据时使用同目录的 Streamlit 版本（app.py），它会从 FastF1 拉取官方计时数据。
    </footer>
</div>

<script>
const DATA = JSON.parse(document.getElementById("race-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const PALETTE = ["#E10600", "#00A19C", "#FF8700", "#3671C6", "#229971", "#9B59B6", "#C0392B", "#7F8C8D"];
const SYMBOLS = ["circle", "square", "diamond", "triangle", "cross", "star"];
const COMPOUND_COLORS = ["#E10600", "#FFC906", "#E8E9EC"];
const COMPOUND_NAMES = ["软胎", "中性胎", "硬胎"];
const COMPOUND_KEYS = DATA.compounds;

const state = { year: null, raceKey: null, drivers: [], hideOutliers: true, telemetryDriver: null };

function svg(tag, attrs, parent) {
    const node = document.createElementNS(NS, tag);
    for (const key in attrs) node.setAttribute(key, attrs[key]);
    if (parent) parent.appendChild(node);
    return node;
}

function html(tag, attrs, parent) {
    const node = document.createElement(tag);
    for (const key in attrs) {
        if (key === "class") node.className = attrs[key];
        else if (key === "text") node.textContent = attrs[key];
        else node.setAttribute(key, attrs[key]);
    }
    if (parent) parent.appendChild(node);
    return node;
}

function fmtLap(ms) {
    if (!ms) return "—";
    const total = ms / 1000;
    const m = Math.floor(total / 60);
    const s = total - m * 60;
    return m + ":" + s.toFixed(3).padStart(6, "0");
}

function fmtSeconds(ms) { return (ms / 1000).toFixed(3); }

function years() { return Object.keys(DATA.years).sort(); }
function racesOfYear() { return DATA.years[state.year] || []; }
function currentRace() { return racesOfYear().find(r => r.key === state.raceKey) || racesOfYear()[0]; }
function driverOf(race, code) { return race.drivers.find(d => d.code === code); }
function styleOf(race, code) {
    const i = Math.max(0, race.drivers.findIndex(d => d.code === code));
    return { color: PALETTE[i % PALETTE.length], symbol: SYMBOLS[i % SYMBOLS.length] };
}
function hasOutliers() { return state.hideOutliers; }

function filteredLaps(race, code) {
    const driver = driverOf(race, code);
    if (!driver) return [];
    const values = driver.laps.map((ms, i) => ({ lap: i + 1, ms })).filter(p => p.ms > 0);
    if (!state.hideOutliers || !values.length) return values;
    const best = Math.min(...values.map(p => p.ms));
    return values.filter(p => p.ms <= best * 1.07);
}

/* ---------------- 交互与渲染入口 ---------------- */

function boot() {
    const yearsList = years();
    state.year = yearsList[yearsList.length - 1];
    const yearSelect = document.getElementById("yearSelect");
    yearsList.forEach(y => html("option", { value: y, text: y + " 赛季" }, yearSelect));
    yearSelect.value = state.year;
    yearSelect.addEventListener("change", () => {
        state.year = yearSelect.value;
        state.raceKey = racesOfYear()[0].key;
        fillRaces();
        resetDrivers();
        renderAll();
    });

    fillRaces();
    resetDrivers();

    document.getElementById("hideOutliers").addEventListener("change", e => {
        state.hideOutliers = e.target.checked;
        renderCharts();
    });
    document.getElementById("resultSearch").addEventListener("input", e => renderResults(e.target.value));
    document.getElementById("telemetrySelect").addEventListener("change", e => {
        state.telemetryDriver = e.target.value;
        renderTelemetry();
    });

    renderAll();

    // 窗口尺寸变化时重绘图表，保证文字与坐标不重叠。
    let timer = null;
    window.addEventListener("resize", () => {
        clearTimeout(timer);
        timer = setTimeout(renderCharts, 150);
    });
}

function fillRaces() {
    const select = document.getElementById("raceSelect");
    select.innerHTML = "";
    racesOfYear().forEach(race => {
        html("option", { value: race.key, text: "第 " + race.round + " 站 · " + race.name }, select);
    });
    select.value = state.raceKey = racesOfYear()[0].key;
    select.onchange = () => {
        state.raceKey = select.value;
        resetDrivers();
        renderAll();
    };
}

function resetDrivers() {
    const race = currentRace();
    const podium = race.results.filter(r => r.pos).slice(0, 3).map(r => r.code);
    state.drivers = podium.length ? podium : race.drivers.slice(0, 2).map(d => d.code);
    state.telemetryDriver = state.drivers[0];
}

function renderAll() {
    const race = currentRace();
    document.getElementById("heroTag").textContent =
        "FORMULA 1 · " + state.year + " 赛季 · 第 " + race.round + " 站";
    document.getElementById("heroTitle").textContent =
        race.name.indexOf("大奖赛") >= 0 ? race.name : race.name + " 大奖赛";
    document.getElementById("heroSub").textContent =
        (race.date || "") + " · 正赛 " + race.laps + " 圈 · " + race.drivers.length + " 位车手";
    document.getElementById("resultNote").textContent = "共 " + race.results.length + " 位参赛车手";

    renderDriverPicker();
    renderResults(document.getElementById("resultSearch").value);
    renderMetrics();
    renderTelemetrySelect();
    renderCharts();
}

function renderDriverPicker() {
    const race = currentRace();
    const host = document.getElementById("driverPicker");
    host.innerHTML = "";

    race.drivers.forEach(driver => {
        const button = html("button", {
            class: "driver",
            type: "button",
            "aria-pressed": state.drivers.includes(driver.code) ? "true" : "false",
        }, host);
        button.style.borderLeftColor = driver.color;
        html("span", { text: driver.code }, button);
        button.addEventListener("click", () => {
            const index = state.drivers.indexOf(driver.code);
            if (index >= 0) state.drivers.splice(index, 1);
            else state.drivers.push(driver.code);
            if (!state.drivers.includes(state.telemetryDriver)) state.telemetryDriver = state.drivers[0];
            renderDriverPicker();
            renderTelemetrySelect();
            renderMetrics();
            renderCharts();
        });
    });

    const clear = html("button", { class: "ghost", type: "button", text: "只看领奖台" }, host);
    clear.addEventListener("click", () => {
        resetDrivers();
        renderDriverPicker();
        renderTelemetrySelect();
        renderMetrics();
        renderCharts();
    });
}

function renderResults(keyword = "") {
    const race = currentRace();
    const word = keyword.trim().toLowerCase();
    const rows = race.results.filter(r =>
        !word || r.code.toLowerCase().includes(word) || r.name.toLowerCase().includes(word) ||
        r.team.toLowerCase().includes(word));

    const podiumHost = document.getElementById("podium");
    podiumHost.innerHTML = "";
    race.results.filter(r => r.pos).slice(0, 3).forEach(r => {
        const card = html("div", { class: "podium-card" }, podiumHost);
        card.style.borderLeftColor = r.color;
        html("div", { class: "podium-pos", text: "P" + r.pos }, card);
        html("div", { class: "podium-code", text: r.code }, card);
        html("div", { class: "podium-name", text: r.name }, card);
        html("div", { class: "podium-team", text: r.team + " · " + r.result }, card);
    });

    const body = document.getElementById("resultBody");
    body.innerHTML = "";
    rows.forEach(r => {
        const tr = html("tr", {}, body);
        html("td", { class: "pos", text: r.pos ? String(r.pos) : "—" }, tr);
        html("td", { text: r.code }, tr);
        html("td", { text: r.name }, tr);
        const teamCell = html("td", { text: r.team }, tr);
        teamCell.style.borderLeft = "3px solid " + r.color;
        html("td", { text: r.grid ? String(r.grid) : "—" }, tr);
        html("td", { text: r.result }, tr);
        html("td", { text: String(r.points) }, tr);
    });

    const grid = document.getElementById("driverGrid");
    grid.innerHTML = "";
    race.results.forEach(r => {
        const cell = html("div", { class: "driver-cell" }, grid);
        cell.style.borderLeftColor = r.color;
        html("span", { class: "p", text: r.pos ? String(r.pos) : "—" }, cell);
        html("span", { class: "c", text: r.code }, cell);
        html("span", { class: "t", text: r.team }, cell);
    });
}

function renderMetrics() {
    const race = currentRace();
    const selected = state.drivers.length ? state.drivers : race.drivers.map(d => d.code);
    const laps = selected.flatMap(code => filteredLaps(race, code));
    const host = document.getElementById("metrics");
    host.innerHTML = "";

    if (!laps.length) {
        html("div", { class: "metric" }, host).appendChild(html("div", { class: "k", text: "没有可用圈速" }));
        return;
    }

    // 找出所选车手中的最快圈，并记下它属于哪位车手。
    let best = null;
    selected.forEach(code => {
        filteredLaps(race, code).forEach(point => {
            if (!best || point.ms < best.ms) best = { ms: point.ms, code };
        });
    });
    const perDriver = selected.map(code => {
        const own = filteredLaps(race, code);
        return { code, best: own.length ? Math.min(...own.map(p => p.ms)) : null };
    }).filter(d => d.best);
    const spread = perDriver.length > 1
        ? Math.max(...perDriver.map(d => d.best)) - Math.min(...perDriver.map(d => d.best))
        : null;
    const stops = Math.max(...selected.map(code => {
        const driver = driverOf(race, code);
        return driver ? Math.max(0, driver.stints.length - 1) : 0;
    }), 0);

    const items = [
        { k: "最快圈 · " + best.code, v: fmtLap(best.ms), d: "所选车手中的最快单圈" },
        { k: "车手圈速差距", v: spread ? fmtSeconds(spread) + " 秒" : "—", d: "个人最快圈之间的差距" },
        { k: "比赛圈数", v: race.laps + " 圈", d: race.drivers.length + " 位车手参赛" },
        { k: "最多进站次数", v: stops + " 次", d: "所选车手中最多者" },
    ];
    items.forEach(item => {
        const card = html("div", { class: "metric" }, host);
        html("div", { class: "k", text: item.k }, card);
        html("div", { class: "v", text: item.v }, card);
        html("div", { class: "d", text: item.d }, card);
    });
}

function renderTelemetrySelect() {
    const select = document.getElementById("telemetrySelect");
    select.innerHTML = "";
    const list = state.drivers.length ? state.drivers : currentRace().drivers.map(d => d.code);
    list.forEach(code => html("option", { value: code, text: code }, select));
    if (!list.includes(state.telemetryDriver)) state.telemetryDriver = list[0];
    select.value = state.telemetryDriver;
}

function renderCharts() {
    renderLapChart();
    renderTyreChart();
    renderTelemetry();
}

/* ---------------- 通用绘图工具 ---------------- */

function niceTicks(min, max, count) {
    const span = max - min;
    if (span <= 0) return [min];
    const rawStep = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(v);
    return ticks;
}

function tooltipFor(host) {
    let tip = host.querySelector(".tooltip");
    if (!tip) tip = html("div", { class: "tooltip" }, host);
    return tip;
}

function axisLabels(chart, M, W, H, xTicks, yTicks, xs, ys, xFmt, yFmt, xTitle, yTitle) {
    xTicks.forEach(t => {
        svg("line", { x1: xs(t), x2: xs(t), y1: M.t, y2: H - M.b, class: "grid-line" }, chart);
        const label = svg("text", {
            x: xs(t), y: H - M.b + 18, class: "axis", "text-anchor": "middle",
        }, chart);
        label.textContent = xFmt(t);
    });
    yTicks.forEach(t => {
        svg("line", { x1: M.l, x2: W - M.r, y1: ys(t), y2: ys(t), class: "grid-line" }, chart);
        const label = svg("text", {
            x: M.l - 8, y: ys(t) + 4, class: "axis", "text-anchor": "end",
        }, chart);
        label.textContent = yFmt(t);
    });
    const xt = svg("text", {
        x: (M.l + W - M.r) / 2, y: H - 6, class: "axis-title", "text-anchor": "middle",
    }, chart);
    xt.textContent = xTitle;
    const yt = svg("text", {
        x: 12, y: M.t - 4, class: "axis-title", "text-anchor": "start",
    }, chart);
    yt.textContent = yTitle;
}

/* ---------------- 圈速对比 ---------------- */

function renderLapChart() {
    const host = document.getElementById("lapChart");
    host.innerHTML = "";
    const race = currentRace();
    if (!state.drivers.length) {
        html("p", { class: "empty", text: "请至少选择一位车手。" }, host);
        return;
    }

    const series = state.drivers.map(code => ({ code, points: filteredLaps(race, code) }))
        .filter(s => s.points.length);
    if (!series.length) {
        html("p", { class: "empty", text: "没有可用的圈速数据。" }, host);
        return;
    }

    const all = series.flatMap(s => s.points.map(p => p.ms)).sort((a, b) => a - b);
    const q = f => all[Math.min(all.length - 1, Math.max(0, Math.round(f * (all.length - 1))))];
    const yMin = q(0.002) - 400;
    const yMax = q(0.998) + 600;
    const xMax = Math.max(...series.flatMap(s => s.points.map(p => p.lap)));

    const W = Math.max(320, host.clientWidth || 720);
    const H = 380;
    const M = { t: 18, r: 16, b: 44, l: 62 };
    const xs = v => M.l + (v - 1) / Math.max(1, xMax - 1) * (W - M.l - M.r);
    const ys = v => H - M.b - (v - yMin) / Math.max(1, yMax - yMin) * (H - M.t - M.b);

    const chart = svg("svg", {
        viewBox: "0 0 " + W + " " + H, width: "100%", height: H,
        role: "img", "aria-label": "单圈用时对比折线图",
    }, host);

    axisLabels(chart, M, W, H,
        niceTicks(1, xMax, 6), niceTicks(yMin, yMax, 5), xs, ys,
        v => String(Math.round(v)), v => fmtSeconds(v), "比赛圈数", "单圈用时（秒）");

    series.forEach(s => {
        const style = styleOf(race, s.code);
        const d = s.points.map((p, i) => (i ? "L" : "M") + xs(p.lap).toFixed(1) + " " + ys(p.ms).toFixed(1)).join(" ");
        svg("path", { d, fill: "none", stroke: style.color, "stroke-width": 2 }, chart);
    });

    const hoverLayer = svg("g", {}, chart);
    const tip = tooltipFor(host);
    const overlay = svg("rect", {
        x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b,
        fill: "transparent", "data-hit": "1",
    }, chart);

    function show(event) {
        const rect = chart.getBoundingClientRect();
        const px = (event.clientX - rect.left) * (W / rect.width);
        const lap = Math.min(xMax, Math.max(1, Math.round(1 + (px - M.l) / (W - M.l - M.r) * (xMax - 1))));
        hoverLayer.innerHTML = "";
        svg("line", { x1: xs(lap), x2: xs(lap), y1: M.t, y2: H - M.b, stroke: "#8A8F99", "stroke-width": 1, "stroke-dasharray": "3 3" }, hoverLayer);

        const rows = [];
        series.forEach(s => {
            const point = s.points.find(p => p.lap === lap);
            if (!point) return;
            const style = styleOf(race, s.code);
            svg("circle", { cx: xs(lap), cy: ys(point.ms), r: 4, fill: style.color, stroke: "#fff", "stroke-width": 1.5 }, hoverLayer);
            rows.push({ code: s.code, ms: point.ms, color: style.color });
        });
        rows.sort((a, b) => a.ms - b.ms);
        tip.innerHTML = "<div style='color:var(--muted);margin-bottom:4px'>第 " + lap + " 圈</div>" +
            rows.map(r => "<div class='row'><span style='color:" + r.color + "'>● " + r.code + "</span><b>" + fmtLap(r.ms) + "</b></div>").join("");
        tip.style.opacity = 1;
        const left = Math.min(rect.width - 150, Math.max(0, (xs(lap) / W) * rect.width + 14));
        tip.style.left = left + "px";
        tip.style.top = "20px";
    }

    overlay.addEventListener("mousemove", show);
    overlay.addEventListener("touchmove", e => { if (e.touches[0]) show(e.touches[0]); }, { passive: true });
    overlay.addEventListener("mouseleave", () => { hoverLayer.innerHTML = ""; tip.style.opacity = 0; });
}

/* ---------------- 轮胎策略 ---------------- */

function renderTyreChart() {
    const host = document.getElementById("tyreChart");
    host.innerHTML = "";
    const race = currentRace();
    if (!state.drivers.length) {
        html("p", { class: "empty", text: "请至少选择一位车手。" }, host);
        return;
    }

    const rows = state.drivers.map(code => ({ code, driver: driverOf(race, code) })).filter(r => r.driver);
    const rowH = 34;
    const W = Math.max(320, host.clientWidth || 720);
    const H = 30 + rows.length * rowH + 40;
    const M = { t: 16, r: 16, b: 34, l: 58 };
    const xMax = race.laps;
    const xs = v => M.l + v / xMax * (W - M.l - M.r);

    const chart = svg("svg", {
        viewBox: "0 0 " + W + " " + H, width: "100%", height: H,
        role: "img", "aria-label": "轮胎策略图",
    }, host);

    niceTicks(0, xMax, 6).forEach(t => {
        svg("line", { x1: xs(t), x2: xs(t), y1: M.t, y2: H - M.b, class: "grid-line" }, chart);
        const label = svg("text", { x: xs(t), y: H - M.b + 18, class: "axis", "text-anchor": "middle" }, chart);
        label.textContent = String(Math.round(t));
    });
    const xTitle = svg("text", { x: (M.l + W - M.r) / 2, y: H - 4, class: "axis-title", "text-anchor": "middle" }, chart);
    xTitle.textContent = "比赛圈数";

    const tip = tooltipFor(host);
    rows.forEach((row, index) => {
        const y = M.t + index * rowH;
        const label = svg("text", { x: M.l - 10, y: y + rowH / 2 + 4, class: "axis", "text-anchor": "end", "font-weight": "700" }, chart);
        label.textContent = row.code;

        row.driver.stints.forEach(stint => {
            const [start, end, compoundIndex] = stint;
            const x1 = xs(start - 1);
            const width = Math.max(2, xs(end) - x1);
            const rect = svg("rect", {
                x: x1, y: y + 6, width: width, height: rowH - 14, rx: 4,
                fill: COMPOUND_COLORS[compoundIndex], stroke: "#3A3D45", "stroke-width": 1,
            }, chart);
            rect.addEventListener("mousemove", e => {
                const rectBox = host.getBoundingClientRect();
                tip.innerHTML = "<div class='row'><span>" + row.code + "</span><b>" + COMPOUND_NAMES[compoundIndex] + "</b></div>" +
                    "<div class='row'><span>圈数区间</span><b>" + start + " - " + end + "</b></div>" +
                    "<div class='row'><span>使用圈数</span><b>" + (end - start + 1) + " 圈</b></div>";
                tip.style.opacity = 1;
                tip.style.left = Math.min(rectBox.width - 160, Math.max(0, e.clientX - rectBox.left + 12)) + "px";
                tip.style.top = Math.max(0, e.clientY - rectBox.top - 48) + "px";
            });
            rect.addEventListener("mouseleave", () => { tip.style.opacity = 0; });

            if (width > 52) {
                const text = svg("text", {
                    x: x1 + width / 2, y: y + rowH / 2 + 4, class: "axis",
                    "text-anchor": "middle", fill: "#12141A",
                }, chart);
                text.textContent = (end - start + 1) + " 圈";
            }
        });
    });
}

/* ---------------- 最快圈遥测 ---------------- */

function hashSeed(text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return h >>> 0;
}

function mulberry32(seed) {
    let a = seed;
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function telemetryFor(code, raceKey, laps) {
    const rnd = mulberry32(hashSeed(raceKey + "|" + code));
    const count = 240;
    const length = 4800 + Math.round(rnd() * 10) * 60 + laps * 8;
    const points = [];
    for (let i = 0; i < count; i++) {
        const phase = i / 9 + rnd() * 0.02;
        const braking = Math.sin(phase) < -0.78;
        const throttle = braking ? 12 : Math.min(100, Math.max(18, 78 + 26 * Math.sin(phase + 0.9)));
        let speed = braking ? 108 : 190 + 96 * Math.max(0, Math.sin(phase + 0.5));
        speed += (rnd() - 0.5) * 8;
        points.push({
            x: i * length / (count - 1),
            speed: Math.max(70, speed),
            throttle,
            brake: braking ? 100 : 0,
        });
    }
    return points;
}

function renderTelemetry() {
    const host = document.getElementById("telemetryChart");
    host.innerHTML = "";
    const race = currentRace();
    const code = state.telemetryDriver || (state.drivers[0] || race.drivers[0].code);
    const points = telemetryFor(code, race.key, race.laps);
    const style = styleOf(race, code);

    const W = Math.max(320, host.clientWidth || 720);
    const speedH = 190;
    const pedalH = 140;
    const H = speedH + pedalH + 46;
    const M = { l: 62, r: 16, t: 16, b: 34 };
    const xMax = points[points.length - 1].x;
    const xs = v => M.l + v / xMax * (W - M.l - M.r);
    const speedMin = 0;
    const speedMax = Math.ceil(Math.max(...points.map(p => p.speed)) / 50) * 50;
    const speedTop = M.t;
    const speedBottom = M.t + speedH;
    const pedalTop = speedBottom + 26;
    const pedalBottom = pedalTop + pedalH;
    const ySpeed = v => speedBottom - (v - speedMin) / (speedMax - speedMin) * (speedBottom - speedTop);
    const yPedal = v => pedalBottom - v / 100 * (pedalBottom - pedalTop);

    const chart = svg("svg", {
        viewBox: "0 0 " + W + " " + H, width: "100%", height: H,
        role: "img", "aria-label": code + " 最快圈遥测图",
    }, host);

    // 速度曲线
    niceTicks(speedMin, speedMax, 4).forEach(t => {
        svg("line", { x1: M.l, x2: W - M.r, y1: ySpeed(t), y2: ySpeed(t), class: "grid-line" }, chart);
        const label = svg("text", { x: M.l - 8, y: ySpeed(t) + 4, class: "axis", "text-anchor": "end" }, chart);
        label.textContent = String(Math.round(t));
    });
    const speedPath = points.map((p, i) => (i ? "L" : "M") + xs(p.x).toFixed(1) + " " + ySpeed(p.speed).toFixed(1)).join(" ");
    svg("path", {
        d: speedPath + " L " + xs(xMax).toFixed(1) + " " + speedBottom + " L " + xs(0).toFixed(1) + " " + speedBottom + " Z",
        fill: "rgba(225,6,0,0.12)", stroke: "none",
    }, chart);
    svg("path", { d: speedPath, fill: "none", stroke: style.color, "stroke-width": 2 }, chart);
    const speedTitle = svg("text", { x: 12, y: speedTop + 10, class: "axis-title" }, chart);
    speedTitle.textContent = code + " 速度（km/h）";

    // 油门与刹车
    [0, 50, 100].forEach(t => {
        svg("line", { x1: M.l, x2: W - M.r, y1: yPedal(t), y2: yPedal(t), class: "grid-line" }, chart);
        const label = svg("text", { x: M.l - 8, y: yPedal(t) + 4, class: "axis", "text-anchor": "end" }, chart);
        label.textContent = t + "%";
    });
    const throttlePath = points.map((p, i) => (i ? "L" : "M") + xs(p.x).toFixed(1) + " " + yPedal(p.throttle).toFixed(1)).join(" ");
    svg("path", {
        d: throttlePath + " L " + xs(xMax).toFixed(1) + " " + pedalBottom + " L " + xs(0).toFixed(1) + " " + pedalBottom + " Z",
        fill: "rgba(0,161,156,0.14)", stroke: "none",
    }, chart);
    svg("path", { d: throttlePath, fill: "none", stroke: "#00A19C", "stroke-width": 1.6 }, chart);
    const brakePath = points.map((p, i) => (i ? "L" : "M") + xs(p.x).toFixed(1) + " " + yPedal(p.brake).toFixed(1)).join(" ");
    svg("path", { d: brakePath, fill: "none", stroke: "#3671C6", "stroke-width": 1.6 }, chart);
    const pedalTitle = svg("text", { x: 12, y: pedalTop - 8, class: "axis-title" }, chart);
    pedalTitle.textContent = "油门与刹车";

    niceTicks(0, xMax, 6).forEach(t => {
        const label = svg("text", { x: xs(t), y: pedalBottom + 20, class: "axis", "text-anchor": "middle" }, chart);
        label.textContent = Math.round(t);
    });
    const xTitle = svg("text", { x: (M.l + W - M.r) / 2, y: H - 4, class: "axis-title", "text-anchor": "middle" }, chart);
    xTitle.textContent = "赛道距离（米）";

    const hoverLayer = svg("g", {}, chart);
    const tip = tooltipFor(host);
    const overlay = svg("rect", {
        x: M.l, y: speedTop, width: W - M.l - M.r, height: pedalBottom - speedTop,
        fill: "transparent",
    }, chart);

    overlay.addEventListener("mousemove", event => {
        const rect = chart.getBoundingClientRect();
        const px = (event.clientX - rect.left) * (W / rect.width);
        const ratio = Math.min(1, Math.max(0, (px - M.l) / (W - M.l - M.r)));
        const point = points[Math.round(ratio * (points.length - 1))];
        hoverLayer.innerHTML = "";
        svg("line", { x1: xs(point.x), x2: xs(point.x), y1: speedTop, y2: pedalBottom, stroke: "#8A8F99", "stroke-width": 1, "stroke-dasharray": "3 3" }, hoverLayer);
        svg("circle", { cx: xs(point.x), cy: ySpeed(point.speed), r: 4, fill: style.color, stroke: "#fff", "stroke-width": 1.5 }, hoverLayer);
        svg("circle", { cx: xs(point.x), cy: yPedal(point.throttle), r: 3.5, fill: "#00A19C" }, hoverLayer);
        svg("circle", { cx: xs(point.x), cy: yPedal(point.brake), r: 3.5, fill: "#3671C6" }, hoverLayer);

        tip.innerHTML = "<div style='color:var(--muted);margin-bottom:4px'>距离 " + Math.round(point.x) + " 米</div>" +
            "<div class='row'><span>速度</span><b>" + Math.round(point.speed) + " km/h</b></div>" +
            "<div class='row'><span>油门</span><b>" + Math.round(point.throttle) + "%</b></div>" +
            "<div class='row'><span>刹车</span><b>" + point.brake + "%</b></div>";
        tip.style.opacity = 1;
        tip.style.left = Math.min(rect.width - 160, Math.max(0, (xs(point.x) / W) * rect.width + 14)) + "px";
        tip.style.top = "20px";
    });
    overlay.addEventListener("mouseleave", () => { hoverLayer.innerHTML = ""; tip.style.opacity = 0; });
}

boot();
